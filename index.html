<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>FHIR Patho Report Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: Roboto, Arial, Helvetica, sans-serif;
        }

        .badge {
            background-color: #0d6efd;
        }
        
    </style>
</head>

<body>
    <div class="container-fluid my-4">
        <div id="title">
            <h2><i>FHIR Patho Report Viewer</i></h2>
        </div>
        <div id="controls" class="mb-3">
            <input type="file" class="form-control" id="inputFile" onchange="newInputFile()" />
        </div>
        <ul class="nav nav-tabs" id="tabs" role="tablist"></ul>
        <div class="tab-content" id="divs"></div>
    </div>

    <script>
        const SUMMARY_SECTIONS = [
            { title: "Administrative Information", types: ["DiagnosticReport", "Patient", "Practitioner", "Organization", "MessageHeader"] },
            { title: "Anforderung", types: ["ServiceRequest"] },
            { title: "Probeninformation", types: ["Specimen"] },
            { title: "Ergebnis", types: ["Observation"] }
        ];

        let _data = null;

        function newInputFile() {
            const reader = new FileReader();
            reader.onload = () => {
                _data = JSON.parse(reader.result);
                displayBundle(_data);
            };
            reader.readAsText(document.getElementById("inputFile").files[0]);
        }

        function displayBundle(data) {
            $("#tabs, #divs").empty();

            const groups = {};
            data.entry.forEach(e => {
                const t = e.resource.resourceType;
                if (!groups[t]) groups[t] = [];
                groups[t].push(e.resource);
            });

            $("#tabs").append(`<li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#summary" type="button" role="tab">Pathologiebefund</button></li>`);
            let summaryHtml = `<div class="tab-pane fade show active" id="summary" role="tabpanel"><br/><h4>PATHOLOGIEBEFUND</h4><br/>`;

            const found = new Set();
            SUMMARY_SECTIONS.forEach(section => {
                const sectionResources = section.types.map(t => ({ type: t, resources: groups[t] })).filter(e => e.resources);
                if (sectionResources.length) {
                    summaryHtml += `<h5><b>${section.title}</b></h5>`;
                    sectionResources.forEach(entry => {
                        summaryHtml += `<h6 class="mt-3"><b>${entry.type}</b></h6>`;
                        summaryHtml += tableFor(entry.resources);
                        found.add(entry.type);
                    });
                }
            });

            // "Weitere" section
            const otherTypes = Object.keys(groups).filter(t => !found.has(t));
            if (otherTypes.length) {
                summaryHtml += `<h5><b>Weitere</b></h5>`;
                otherTypes.forEach(type => {
                    summaryHtml += `<h6 class="mt-3"><b>${type}</b></h6>`;
                    summaryHtml += tableFor(groups[type]);
                });
            }

            summaryHtml += `</div>`;
            $("#divs").append(summaryHtml);

            // Tabs for each resource type
            Object.entries(groups).sort().forEach(([type, resources]) => {
                $("#tabs").append(`<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-${type.toLowerCase()}" type="button" role="tab">${type} <span class="badge rounded-pill">${resources.length}</span></button></li>`);
                $("#divs").append(`<div class="tab-pane fade" id="tab-${type.toLowerCase()}" role="tabpanel">${tableFor(resources)}</div>`);
            });
        }

        function tableFor(resources) {
            const cols = new Set();
            resources.forEach(r => Object.keys(r).forEach(k => cols.add(k)));
            //["text", "meta", "id", "resourceType"].forEach(k => cols.delete(k));
            ["text"].forEach(k => cols.delete(k));
            const headers = Array.from(cols);

            let html = `<table class="table table-striped table-sm"><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>`;
            resources.forEach(r => {
                html += `<tr>${headers.map(h => `<td>${formatVal(r[h])}</td>`).join("")}</tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        function formatVal(val) {
            if (val == null) return "";
            if (Array.isArray(val)) return val.map(formatVal).join("<br><br>");
            if (typeof val === "object") {
                if (val.display) return val.display;
                if (val.text) return val.text;
                if (val.value) return val.value;
                return Object.values(val).map(formatVal).join(" • ");
            }
            return val;
        }
    </script>
</body>

</html>
